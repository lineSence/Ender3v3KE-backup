title:
body: <b>Ender-3 V3 KE</b><br><br>Ender-3 V3 KE<br><br>▶️ <b>ПЕЧАТЬ ПРОДОЛЖЕНА</b><br><br>📄 <code>{event_args[1].filename}</code>

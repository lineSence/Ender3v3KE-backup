body: <b>Ender-3 V3 KE</b><br><br>⏸ <b>ПЕЧАТЬ ПРИОСТАНОВЛЕНА</b><br><br>📄 <code>{event_args[1].filename}</code><br><br>⚠️ Требуется действие
